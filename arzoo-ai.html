<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arzoo AI | Study King</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
        }

        .ai-header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .ai-header h1 {
            font-size: 28px;
        }

        .ai-header p {
            margin-top: 6px;
            opacity: 0.8;
        }

        .chat-box {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }

        .welcome {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        #question {
            flex: 1;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        .ask-btn {
            border: none;
            background: #4f46e5;
            color: white;
            padding: 14px 20px;
            border-radius: 10px;
            cursor: pointer;
        }

        .answer {
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            display: none;
        }
    </style>
</head>

<body>

    <header class="ai-header">
        <h1>🤖 Arzoo AI</h1>
        <p>Your Study King AI Assistant</p>
    </header>

    <main class="chat-box">

        <div class="welcome">
            <h2>👋 Hello!</h2>
            <p>Ask me your Commerce study question.</p>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="question"
                placeholder="Ask your question..."
            >

            <button class="ask-btn" onclick="askAI()">
                Ask
            </button>
        </div>

        <div class="answer" id="answer"></div>

    </main>

    <script>
        function askAI() {
            const question = document.getElementById("question").value;
            const answer = document.getElementById("answer");

            if (!question.trim()) {
                answer.style.display = "block";
                answer.innerHTML = "⚠️ Please enter a question.";
                return;
            }

            answer.style.display = "block";
            answer.innerHTML =
                "🤖 Arzoo AI: Your question has been received. AI connection will be added in the next step.";
        }
    </script>

</body>
</html>
