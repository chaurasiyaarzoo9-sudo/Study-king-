    <h1>Chapter 3: Demand</h1>
    <h2>Class 11 Economics</h2>

    <h3>Meaning of Demand</h3>
    <p>Demand refers to the quantity of a commodity that a consumer is willing and able to purchase at a given price.</p>

    <h3>Law of Demand</h3>
    <p>Other things remaining constant, price rises → demand falls, and price falls → demand rises.</p>
